global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus self-metrics scraper
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Host OS metrics scraper via Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Docker container metrics scraper via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
