services:
  database:
    image: mongo:6.0
    container_name: niyantran_database
    restart: unless-stopped
    ports:
      - "${HOST_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - niyantran_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (required by bhiv-bucket for caching) ─────────────────────────────
  redis:
    image: redis:7.0-alpine
    container_name: niyantran_redis
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - niyantran_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── BHIV Bucket (must start before KARMA — B7 authorization constraint) ─────
  bhiv-bucket:
    build:
      context: ./bhiv-bucket
      dockerfile: Dockerfile
    container_name: niyantran_bucket
    restart: unless-stopped
    ports:
      - "${HOST_BUCKET_PORT:-8001}:8001"
    env_file:
      - .env.example
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - niyantran_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── BHIV PRANA (stateless forwarding — B6: session endpoint not yet built) ──
  bhiv-prana:
    build:
      context: ./bhiv_prana
      dockerfile: Dockerfile
    container_name: niyantran_prana
    restart: unless-stopped
    ports:
      - "${HOST_PRANA_PORT:-8002}:8002"
    env_file:
      - .env.example
    networks:
      - niyantran_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Karma-Tracker (restricted: x-source must be bucket/core/internal — B7) ─
  karma-tracker:
    build:
      context: ./Karma-Tracker/karma-tracker
      dockerfile: Dockerfile
    container_name: niyantran_karma
    restart: unless-stopped
    ports:
      - "${HOST_KARMA_PORT:-8003}:8003"
    env_file:
      - .env.example
    networks:
      - niyantran_network
    depends_on:
      bhiv-bucket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: niyantran_backend
    restart: unless-stopped
    ports:
      - "${HOST_BACKEND_PORT:-5000}:5000"
    env_file:
      - .env.example
    environment:
      - BUCKET_BASE_URL=http://bhiv-bucket:8001
      - PRANA_BASE_URL=http://bhiv-prana:8002
    networks:
      - niyantran_network
    depends_on:
      database:
        condition: service_healthy
      bhiv-bucket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_PRANA_BUCKET_URL=${VITE_PRANA_BUCKET_URL}
    container_name: niyantran_frontend
    restart: unless-stopped
    ports:
      - "${HOST_FRONTEND_PORT:-80}:80"
    env_file:
      - .env.example
    networks:
      - niyantran_network
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  niyantran_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

