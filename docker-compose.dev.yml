services:
  database:
    image: mongo:6.0
    container_name: niyantran_database
    restart: unless-stopped
    ports:
      - "${HOST_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - niyantran_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: niyantran_backend
    restart: unless-stopped
    ports:
      - "${HOST_BACKEND_PORT:-5000}:5000"
    env_file:
      - .env.example
    networks:
      - niyantran_network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_PRANA_BUCKET_URL=${VITE_PRANA_BUCKET_URL}
    container_name: niyantran_frontend
    restart: unless-stopped
    ports:
      - "${HOST_FRONTEND_PORT:-80}:80"
    env_file:
      - .env.example
    networks:
      - niyantran_network
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  niyantran_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
